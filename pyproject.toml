[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "api-attack-path-tester"
version = "0.2.0"
description = "Authorized API authorization and attack-path testing tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "PyYAML>=6.0,<7",
  "rich>=13.7,<15",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.23,<2"]

[project.scripts]
apiat = "apiat.cli.main:main"
# Backwards-compatible alias for early 0.1.x users. Prefer `apiat`.
aapt = "apiat.cli.main:legacy_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
